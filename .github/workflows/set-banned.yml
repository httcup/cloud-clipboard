name: 写入违禁词库到 KV
on:
  workflow_dispatch: {}

jobs:
  put-banned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 写入 cfg:banned
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler kv key put "cfg:banned" --path banned-words.txt --binding NOTES_KV --remote
          echo "词库已写入，共 $(grep -c . banned-words.txt) 个词"
