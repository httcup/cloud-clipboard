name: 绑定自定义域名 note.139t.cn
on:
  workflow_dispatch: {}

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - name: 绑定 Pages 自定义域名并配置 DNS
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: note.139t.cn
          ZONE_NAME: 139t.cn
          PROJECT: cloud-clipboard
          TARGET: cloud-clipboard-2j1.pages.dev
        run: |
          set -e
          H=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          # 1. 确认 zone 是否在本账号
          ZONES=$(curl -s "${H[@]}" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME")
          ZONE_ID=$(echo "$ZONES" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::zone $ZONE_NAME 不在此 Cloudflare 账号中，无法自动配 DNS。"
            echo "RESULT: zone-missing"
          else
            echo "zone id: $ZONE_ID"
            # 2. 创建 CNAME（proxied），已存在则跳过
            EXISTING=$(curl -s "${H[@]}" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=$DOMAIN")
            CNT=$(echo "$EXISTING" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('result',[])))")
            if [ "$CNT" = "0" ]; then
              curl -s -X POST "${H[@]}" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -d "{\"type\":\"CNAME\",\"name\":\"$DOMAIN\",\"content\":\"$TARGET\",\"proxied\":true}" | grep -oE '"success":(true|false)'
              echo "DNS CNAME 已创建"
            else
              echo "DNS CNAME 已存在，跳过"
            fi
          fi

          # 3. 绑定 Pages 自定义域名
          RESP=$(curl -s -X POST "${H[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -d "{\"name\":\"$DOMAIN\"}")
          echo "$RESP" | grep -oE '"success":(true|false)|"message[^,}]*' | head -3

          # 4. 查询域名验证状态
          curl -s "${H[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('domain status:',r.get('status'),'| validation:',r.get('validation_data'))"
          echo "RESULT: done"
